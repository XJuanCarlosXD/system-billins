[build]
  base    = "frontend"
  command = "npm install --legacy-peer-deps && npm run build:netlify"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

# SPA: cualquier ruta sirve index.html (TanStack Router maneja routing)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cabeceras seguras
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

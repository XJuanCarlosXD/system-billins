services:
  caddy:
    image: caddy:2-alpine
    container_name: facturation_caddy
    ports:
      - "80:80"
      - "8443:8443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

  oracle-xe:
    # Oracle Database Free (23ai) — reemplaza el intento anterior con
    # oracle-xe:21 (contenedor quedó "Exited (10)", nunca llegó a usarse).
    # Fork independiente del Oracle 11g original (10.0.0.51): ver
    # docs/superpowers/specs/2026-08-01-separar-oracle-standalone-design.md.
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: facturation_oracle
    profiles: ["oracle"]
    environment:
      - ORACLE_PASSWORD=Temp1234Oracle
      - ORACLE_CHARACTERSET=AL32UTF8
      - APP_USER=sigaft
      - APP_USER_PASSWORD=Temp1234Oracle
      # VM tiene solo 1.3GB RAM total (upgrade de hardware pendiente,
      # no instalado todavia) -- sin esto Oracle calcula un SGA/PGA que no
      # cabe y falla con ORA-27104. Recordar subir estos valores cuando
      # llegue el upgrade de RAM.
      - ORACLE_INIT_SGA_SIZE=384
      - ORACLE_INIT_PGA_SIZE=256
    ports:
      - "1525:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./oracle_init:/container-entrypoint-initdb.d
      - ./oracle_dump:/dump
    # Igual que arriba: 1g excedia el /dev/shm real del host (667MB).
    shm_size: 512m
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: facturation_backend
    env_file:
      - ./backend/.env
    init: true
    expose:
      - "8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    restart: unless-stopped
    # ASGI: Django runserver es WSGI y no sirve /mcp/. Usamos uvicorn con --reload.
    # El ENTRYPOINT de Dockerfile.dev (docker/entrypoint.sh) arranca cron y luego
    # exec'ea este comando como PID del proceso principal.
    command: ["uvicorn", "facturation_api.asgi:application", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  backend_data:
  oracle_data:
  caddy_data:
  caddy_config:

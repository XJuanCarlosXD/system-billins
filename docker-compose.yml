services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: facturation_backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: facturation_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # node_modules en volumen anonimo: evita conflicto host vs contenedor.
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=http://10.0.0.99:8000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
